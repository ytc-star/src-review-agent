{% extends "base.html" %}{% block title %}新建研判 · SRC Review Agent{% endblock %}{% block content %}<div class="page-head"><div><div class="eyebrow">NEW REVIEW</div><h1>提交漏洞材料</h1><p>请使用脱敏、已授权的数据。HTTP 请求、响应和 PoC 越完整，结果越可靠。</p></div></div>
<form class="card report-form" method="post" action="/reviews"><div class="grid2"><label>报告标题 *<input name="title" required placeholder="示例：用户资料接口疑似水平越权"></label><label>受影响资产<input name="asset" placeholder="https://demo.example/api/user/profile"></label></div><label>漏洞描述 *<textarea name="report" required rows="7" placeholder="描述发现过程、前置条件、实际影响和已完成的验证……"></textarea></label><div class="grid2"><label>HTTP Request<textarea name="http_request" rows="12" class="mono" placeholder="GET /api/user/profile?user_id=1001 HTTP/1.1&#10;Host: demo.example&#10;Cookie: session=REDACTED"></textarea></label><label>HTTP Response<textarea name="http_response" rows="12" class="mono" placeholder="HTTP/1.1 200 OK&#10;Content-Type: application/json&#10;&#10;{...}"></textarea></label></div><label>PoC / 补充证据<textarea name="poc" rows="6" class="mono" placeholder="粘贴脱敏后的验证脚本、复现步骤或截图文字说明"></textarea></label><div class="form-actions"><span>提交后会同时运行规则检查与已配置的模型分析</span><button class="primary">开始辅助研判 →</button></div></form>{% endblock %}
